version: 2.1

commands:
  checkout_pr_commit:
    steps:
      - checkout
      - run:
          name: Validate and check out the PR commit
          command: |
            set -euo pipefail
            python3 -c '
            import json
            import os

            event = json.loads(os.environ["PR_EVENT_JSON"])
            number = event["pr"]
            sha = event["sha"]
            if not isinstance(number, int) or number < 1 or not isinstance(sha, str):
                raise SystemExit("Invalid PR build request")
            print(number, sha)
            ' > /tmp/nelaric-pr-info
            read -r pr_number pr_sha < /tmp/nelaric-pr-info
            python3 Scripts/pr_build_policy.py "$pr_number" "$pr_sha"
            git fetch --no-tags https://github.com/Nelaric/nelaric-unreal-gameplay.git "refs/pull/$pr_number/head"
            actual_sha="$(git rev-parse FETCH_HEAD)"
            test "$actual_sha" = "$pr_sha"
            git checkout --detach "$actual_sha"
            test "$(git rev-parse HEAD)" = "$pr_sha"
  pull_unreal_image:
    steps:
      - run:
          name: Pull Unreal Engine 5.6.1 Linux image
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            : "${GHCR_USERNAME:?Set GHCR_USERNAME in CircleCI project settings}"
            : "${GHCR_TOKEN:?Set GHCR_TOKEN in CircleCI project settings}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker pull ghcr.io/epicgames/unreal-engine:dev-slim-5.6.1
            docker logout ghcr.io
  compile_target:
    parameters:
      target:
        type: string
      save_project_dir:
        type: boolean
        default: false
    steps:
      - run:
          name: Compile << parameters.target >> for Linux
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            project_dir="$(mktemp -d)"
            if << parameters.save_project_dir >>; then
              printf 'export NELARIC_CI_PROJECT_DIR=%q\n' "$project_dir" >> "$BASH_ENV"
            fi
            cp -a NelaricGameplay "$project_dir/NelaricGameplay"
            chmod -R a+rwX "$project_dir"
            docker run --rm --network none \
              --mount "type=bind,src=$project_dir,dst=/workspace" \
              ghcr.io/epicgames/unreal-engine:dev-slim-5.6.1 \
              /home/ue4/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh \
              << parameters.target >> Linux Development \
              -Project=/workspace/NelaricGameplay/NelaricGameplay.uproject \
              -WaitMutex -NoHotReload
  run_project_automation_tests:
    steps:
      - run:
          name: Run Nelaric automation tests
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            : "${NELARIC_CI_PROJECT_DIR:?Editor build directory is missing}"
            if docker run --rm --network none \
                --mount "type=bind,src=$NELARIC_CI_PROJECT_DIR,dst=/workspace" \
                ghcr.io/epicgames/unreal-engine:dev-slim-5.6.1 \
                /home/ue4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor-Cmd \
                /workspace/NelaricGameplay/NelaricGameplay.uproject \
                -unattended -nopause -nosplash -NullRHI \
                '-ExecCmds=Automation SetFilter All;RunTests StartsWith:Nelaric;Quit' \
                '-TestExit=Automation Test Queue Empty' \
                -ReportExportPath=/workspace/automation-report \
                -AbsLog=/workspace/automation.log; then
              editor_status=0
            else
              editor_status=$?
            fi
            python3 Scripts/check_automation_report.py \
              "$NELARIC_CI_PROJECT_DIR/automation-report/index.json" \
              "$NELARIC_CI_PROJECT_DIR/automation.log" \
              "$editor_status"

jobs:
  build_game_linux:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PR_EVENT_JSON: "<< pipeline.trigger_parameters.webhook.body >>"
    steps:
      - checkout_pr_commit
      - pull_unreal_image
      - compile_target:
          target: NelaricGameplay
  build_editor_linux:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PR_EVENT_JSON: "<< pipeline.trigger_parameters.webhook.body >>"
    steps:
      - checkout_pr_commit
      - pull_unreal_image
      - compile_target:
          target: NelaricGameplayEditor
          save_project_dir: true
      - run_project_automation_tests
  build_server_linux:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PR_EVENT_JSON: "<< pipeline.trigger_parameters.webhook.body >>"
    steps:
      - checkout_pr_commit
      - pull_unreal_image
      - compile_target:
          target: NelaricGameplayServer

workflows:
  fork_pr_linux_build:
    when: pipeline.definition.id == "ac7bbb47-aaa9-4252-97ca-466912f1782d" and pipeline.trigger.type == "webhook"
    jobs:
      - build_game_linux:
          filters:
            branches:
              only: main
      - build_editor_linux:
          filters:
            branches:
              only: main
      - build_server_linux:
          filters:
            branches:
              only: main
