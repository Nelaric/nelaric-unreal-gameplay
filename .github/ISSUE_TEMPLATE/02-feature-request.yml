name: Capability proposal / 能力提案
description: Propose a gameplay-agnostic server capability, provider integration, or developer workflow.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are both welcome. Search existing issues before proposing a capability. Nelaric provides dedicated server infrastructure mechanisms; gameplay rules and high-frequency replication stay with the game and Unreal Engine. Proposals are welcome even while the framework is being designed.
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case / 问题与使用场景
      description: Describe the developer need and the concrete server scenario. Explain why existing UE or project mechanisms do not solve it.
      placeholder: When building a dedicated server, I need to ... because ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Capability area / 能力领域
      options:
        - Runtime and lifecycle
        - Player admission and identity
        - Session and allocation
        - Generic data and persistence
        - Backend communication
        - Operations and observability
        - Hosting and infrastructure
        - Extension and provider integration
        - Development tooling and documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议的行为
      description: Describe the observable behavior or developer workflow. An API sketch is welcome but not required.
      placeholder: The framework should let a developer ...
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and boundaries / 范围与边界
      description: Explain whether this belongs in Core, an optional provider, or tooling, and what should remain game-specific. If unsure, say so.
      placeholder: Core would provide ...; a provider or game would decide ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and references / 替代方案与参考资料
      description: Mention UE-native approaches, existing providers, related issues, or tradeoffs you considered.
    validations:
      required: false
